# envbuild topology: the build runs IN a Kubernetes cluster (Kaniko),
# verification runs HERE against the local docker socket.
#
#   agent ──kubectl──▶ Kaniko Pod ──push──▶ registry (Docker Hub)
#     │                                          │
#     └─ /var/run/docker.sock ◀──────────────────┘  (host daemon pulls the
#        (verification runs only)                    same digest back)
#
# A real registry, not a compose-local one: the build pod lives in the cluster
# and cannot reach a service on this host's compose network. Both halves have to
# meet somewhere, and Docker Hub is the somewhere.
#
#   docker compose run --rm -v /path/to/model:/workspace/repo agent
#
# PHASE 0 IS FOR TRUSTED REPOS ONLY. Verification containers run model code with
# no meaningful sandbox. Do not point this at public submissions.

services:
  agent:
    build:
      context: .
      dockerfile: harness/Dockerfile
    image: mismplatform/pi-envagent:develop
    # Never silently substitute the published tag for the locally built one --
    # a published image lagging this Dockerfile dies at the first build with
    # the image looking right.
    pull_policy: never
    environment:
      ENVBUILD_KANIKO_NAMESPACE: ${ENVBUILD_KANIKO_NAMESPACE:-default}
      ENVBUILD_KANIKO_KUBECONFIG: /home/node/.kube/config
      ENVBUILD_REGISTRY_PUSH: ${ENVBUILD_REGISTRY_PUSH:-docker.io/mismplatform}
      # Empty -> pull the pushed ref as-is. Only set when the push and pull
      # hostnames genuinely differ.
      ENVBUILD_REGISTRY_PULL: ${ENVBUILD_REGISTRY_PULL:-}
      ENVBUILD_REGISTRY_INSECURE: "false"
      ENVBUILD_REGISTRY_FLAT: "true"
      ENVBUILD_OUTPUTS: /workspace/outputs
      MODEL_REPO: /workspace/repo
      MODEL_ID: ${MODEL_ID:-}
      ANNOTATION: ${ANNOTATION:-}
      PROMPT: ${PROMPT:-}
      MISM_GUID: ${MISM_GUID:-}
      # Credentials come from the HOST env, never from this file. Same shape as
      # scratch/pi-agent/run.sh: Azure OpenAI via base-url + key, or Anthropic.
      # entrypoint.sh picks the provider from whichever key is present.
      AZURE_OPENAI_BASE_URL: ${AZURE_OPENAI_BASE_URL:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
    volumes:
      # Verification runs only -- the agent never builds through this socket.
      - /var/run/docker.sock:/var/run/docker.sock
      - ./outputs:/workspace/outputs
      # Read-only. Kaniko itself reads its push creds from the in-cluster
      # Secret (envbuild-registry-auth), not from this file -- this one is for
      # the verification-side `docker pull` only.
      - ${ENVBUILD_DOCKER_CONFIG:-../benchmark-envagent/.secrets/dockerhub-config.json}:/home/node/.docker/config.json:ro
      - ${ENVBUILD_KUBECONFIG:-../../../kubeconfig/kubeconfig-az-mism-dev}:/home/node/.kube/config:ro
    # The socket is root-owned; join the group that owns it rather than running
    # the agent as root. REQUIRED, with no default on purpose: a wrong gid does
    # not fail until L1, i.e. after a full build has already been paid for.
    #   export DOCKER_GID=$(stat -c %g /var/run/docker.sock)
    group_add: ["${DOCKER_GID:?set DOCKER_GID=$(stat -c %g /var/run/docker.sock) so the agent can reach the docker socket}"]
