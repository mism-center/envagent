name: Build & Push Develop Image

# Develop CD: every push to develop rebuilds the Pi harness image (skill +
# extensions baked in) and pushes a rolling :develop tag plus an immutable
# :develop-<short-sha> for pinning a specific build.
on:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: docker-develop
  cancel-in-progress: true

jobs:
  develop-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: mismplatform
          password: ${{ secrets.MISM_DOCKER_PUSH_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push develop image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: harness/Dockerfile
          push: true
          tags: |
            mismplatform/pi-envagent:develop
            mismplatform/pi-envagentagent:develop-${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
