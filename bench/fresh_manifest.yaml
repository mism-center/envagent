# Pre-registered fresh evaluation set (see fresh.purpose). Generated; edit only by re-running the rule.
fresh:
  created: '2026-11-23'
  purpose: A pre-registered evaluation set the agent has never been tuned on. Each pass on it is reported once; nothing in
    the agent may be changed because of one of these repos.
  frame: GitHub repositories found by topic search (agent-based-modeling, agent-based-model, systems-biology, computational-biology
    simulation, epidemiology simulation, computational-neuroscience simulation, mathematical-biology, epidemic-model, sbml
    simulation, pharmacometrics, cell-simulation, population-dynamics) x language (Python, R, Julia), >=10 stars, updated
    since 2024-01-01, not archived. 153 found.
  mechanical_filters: 'drop repos already benchmarked, vivarium-collective, over 400 MB, and descriptions naming a list/course/tutorial/book/workshop:
    143 left'
  order: sha256('envbuild-fresh-2026-11-23' + full_name), ascending
  eligibility: in order, include a repo when it is a computational model or simulation of a biological, biomedical, epidemiological
    or ecological system, or a framework for building such simulations, meant to be run; exclude analysis-only tools, data
    pipelines, LLM-agent frameworks, general-purpose (non-life-science) ABM/economics, file-format libraries. Stop at 20 included
    (reached at rank 60).
  ground_truth: bench/fresh_ground_truth.yaml, written from each README at its pinned sha by a reviewer that had not seen
    the agent run on any of them
