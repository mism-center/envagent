schema: envbuild-ground-truth/1
models:
  vivarium-chemotaxis:
    buildable: true
    language: python
    example: pytest -m 'not slow'
    example_full: python chemotaxis/experiments/paper_experiments.py 7b
    workdir: null
    timeout_s: 600
    expected_outputs: []
    human_verified: null
    source: README.md
    notes: 'Annotation lists three per-process scripts (chemoreceptor_cluster, flagella_motor, membrane_potential); those
      are legitimate smoke examples too, README headline is the test suite and the paper experiments. Only model that has
      ever verified at L3.

      '
  tumor-tcell:
    buildable: true
    language: python
    example: python tumor_tcell/experiments/main.py -w 3
    example_full: null
    workdir: null
    timeout_s: 900
    expected_outputs: []
    human_verified: null
    source: README.md
    notes: 'README gives `main.py -w [workflow id]` with `-w 3` as the concrete example. Needs libGL/libxcb/libglib (opencv
      wheel); Python 3.8 in the earlier passes -- EOL.

      '
  spatio-flux:
    buildable: true
    language: python
    example: python scripts/reproduce.py
    example_full: python scripts/reproduce.py
    workdir: null
    timeout_s: 1200
    expected_outputs: []
    human_verified: null
    source: README.md
    notes: 'README headline is `uv run python scripts/reproduce.py`. Measured in pass aks-rev4-6: 19 studies simulate in ~11
      min and were writing figures + zarr when the 600 s L3 deadline killed the run -- ~14 min end to end, not hours. `pytest`
      was the earlier draft example; the reproduction is what the repo says to run, and it is what the builder now runs. Needs
      installed mode (allocate_core discovers processes over installed dists), writable_copy (cwd-relative reads and writes),
      and the undeclared xarray + zarr. `tests/` is the smoke tier. Annotation entry `run_study.py <SLUG>` has a placeholder.
      vivarium stack needs numpy<2. 244 MB repo (56 MB .git).

      '
  circadian-clock:
    buildable: true
    language: python
    example: python biomodels/coreClock/run_clock_model.py
    example_full: python biomodels/fullModel/runModel.py
    workdir: biomodels/coreClock
    timeout_s: 600
    expected_outputs: []
    human_verified: null
    source: structure (no README)
    notes: 'BioModels MODEL2109140001 bundle. The script reads dat/*.txt relative to its own directory -- the annotation omits
      the workdir, which is why every earlier pass died at L3. Rev 4 derives the workdir at init.

      '
  mbmm:
    buildable: true
    language: r
    example: Rscript inst/examples/01_simulated_correlate_of_protection.R
    example_full: Rscript -e 'testthat::test_local()'
    workdir: null
    timeout_s: 900
    expected_outputs: []
    human_verified: null
    source: inst/examples
    notes: 'Annotation lists `R` and `R -e` as entry points (not commands). R package; needs deSolve from CRAN and R CMD INSTALL
      in installed mode.

      '
  gsmn-tb:
    buildable: false
    language: sbml
    expected_verdict: failed
    expected_failure_class: ENTRYPOINT_UNKNOWN
    example: null
    notes: 'Raw SBML (MODEL1507180021) with no bundled runnable code, by design. The correct builder outcome is an honest
      `failed` naming the missing entry point, not an image.

      '
  hybrid-model-tb:
    buildable: false
    language: gama
    expected_verdict: escalated
    expected_failure_class: null
    example: null
    notes: 'GAMA model (HybridTB.gaml); GAMA has a headless runner but Java/GAMA is outside the Phase 0 toolchain table. The
      two R scripts are post-processing on GAMA output, not the model. Becomes buildable when a gama-headless base is added
      to base_selection.

      '
