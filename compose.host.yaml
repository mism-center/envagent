# Overlay for driving envbuild from the HOST (a Claude Code session, or a plain
# shell) instead of from the agent container.
#
#   docker compose -f compose.yaml -f compose.host.yaml up -d buildkitd registry
#
# The base compose file deliberately leaves buildkitd unpublished: it is an
# unauthenticated builder, and anything that can reach it can run arbitrary code
# as root inside the builder. This overlay binds it to 127.0.0.1 ONLY -- never
# change that to 0.0.0.0 or the host becomes a public build service.
services:
  buildkitd:
    ports: ["127.0.0.1:1234:1234"]
