# envbuild configuration. Every value here is also settable per-run with
# `--config <file>`; the endpoint settings also read env vars, which is how a
# host-driven run and an in-cluster run differ without a code change.

[builder]
# Kubernetes is the whole substrate: builds are Kaniko pods, verification runs
# are their own pods, and bytes move on PVCs. Nothing shells out to kubectl and
# nothing needs `pods/exec` -- see src/k8s.py and deploy/rbac.yaml.

# Empty -> whichever namespace this pod is running in (read from the mounted
# ServiceAccount). Once the agent is itself a pod this cannot be wrong, so it is
# the right default. Set it only for a host-driven run.
namespace =
# Credentials, first hit wins: these two, then the in-cluster ServiceAccount,
# then `kubeconfig` below. Leave all three empty in-cluster.
token =
api_server =
# Transitional, for driving a run from a laptop or CI runner. A kubeconfig that
# authenticates through an exec credential plugin (kubelogin, EKS, GKE) is
# rejected with a message saying so -- envbuild runs no helper binaries.
kubeconfig =

# Scratch envbuild owns: rendered Dockerfiles, Kaniko's digest file, and each
# job's inputs/ and outputs/. RWX, because the agent and the pods it creates
# mount it at the same time.
work_pvc = envbuild-work
work_mount = /work
# Where the model artifacts live. Mounted READ-ONLY everywhere it appears, so
# nothing envbuild runs can modify the corpus source. Empty disables the mount,
# which limits jobs to `mounted` install mode with no code verification.
models_pvc =
models_mount = /models

# PINNED ON PURPOSE. `:latest` is a build agent that changes underneath you
# without a commit. The whole value of the attempt corpus is that records are
# comparable across runs; if error text shifts mid-corpus the signatures split
# and nobody can tell why. Bump deliberately, and expect a discontinuity.
kaniko_image = gcr.io/kaniko-project/executor:v1.23.2
# Secret holding registry credentials (kubernetes.io/dockerconfigjson). Kaniko
# reads it to push; verification pods use it as an imagePullSecret. Created once
# per cluster by an operator -- envbuild has no write access to Secrets.
docker_config_secret = envbuild-registry-auth

# Where the build pod pushes. It must be reachable FROM THE CLUSTER, which is
# why this is a real registry and not a cluster-local one.
registry_push = docker.io/mismplatform
insecure_registry = false
# Docker Hub (and similar) allow exactly namespace/repository, no deeper
# nesting -- unlike registry:2 / GHCR / ECR, which tolerate an arbitrary path.
# true -> job identity folds into the tag instead of the path.
flat_registry = true

[verifier]
# Memory limit per verification pod, e.g. 8g. Empty means no limit.
memory =

[budgets]
max_attempts = 5
wall_clock_s = 1200
# Both become the pod's `activeDeadlineSeconds`, so the kubelet enforces them
# and a wedged container cannot outlive its rung.
build_timeout_s = 600
# Per verification pod, and it governs L1, L2 and L3 alike. Was 180, which L1/L2
# additionally hardcoded -- so raising this used to change L3 only, with nothing
# to say why the L1 timeout stayed. 300 because a cold container on a large
# image (mbmm's R stack is 857 MB) does not reliably clear 180s on a busy host,
# and because one rung should still not be able to eat a whole wall_clock_s.
verify_timeout_s = 300
# Checked against the registry manifest before anything executes. Those are
# compressed layer sizes, so they read a little under an unpacked image -- the
# headroom here is deliberate.
max_image_bytes = 8589934592
max_context_bytes = 268435456

[paths]
# Unset -> <skill dir>/outputs. attempts.jsonl and verdicts.jsonl land here.
