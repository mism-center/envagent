# envbuild configuration. Every value here is also settable per-run with
# `--config <file>`; the four endpoint settings also read env vars, which is how
# the compose stack and the cluster differ without a code change.

[builder]
# The agent talks to a standalone buildkitd over gRPC. Never the embedded
# builder: registry cache export needs this, structured progress is native to
# it, and it is the topology the infra team deploys.
buildkit_host = tcp://buildkitd:1234
# PINNED ON PURPOSE. `moby/buildkit:latest` is a build agent that changes
# underneath you without a commit. The whole value of the attempt corpus is that
# records are comparable across runs; if vertex semantics or error text shift
# mid-corpus the error signatures split and nobody can tell why. Bump
# deliberately, and expect a signature discontinuity when you do.
buildkit_version = v0.24.0
# Where buildkitd pushes. Reachable from the buildkitd container.
registry_push = registry:5000
insecure_registry = true
prune_on_cleanup = true

[verifier]
# Where the HOST docker daemon pulls the same image from. Different host, same
# digest: dockerd trusts localhost registries without an --insecure-registry
# daemon flag, which is why this is not `registry:5000`.
registry_pull = localhost:5000
# Used only for tar in/out of the named volumes. Pin by digest before the corpus run.
helper_image = busybox:1.36
# e.g. 8g -- empty means no limit.
memory =

[budgets]
max_attempts = 5
wall_clock_s = 1200
build_timeout_s = 600
verify_timeout_s = 180
max_image_bytes = 8589934592
max_context_bytes = 268435456

[paths]
# Left empty -> <skill dir>/outputs. attempts.jsonl and verdicts.jsonl land here.
