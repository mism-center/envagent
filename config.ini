# envbuild configuration. Every value here is also settable per-run with
# `--config <file>`; the four endpoint settings also read env vars, which is how
# the compose stack and the cluster differ without a code change.

[builder]
# "local" -> LocalBuildKitBuilder (buildctl/buildkitd). "kaniko" -> K8sBuilder,
# for a cluster whose admission policy blocks BuildKit outright (privileged
# denied, and rootless's Unconfined seccomp / uid-mapping escalation denied
# too) -- see k8s_builder.py's module docstring. Same Builder protocol either
# way; nothing downstream branches on this.
backend = local
# The agent talks to a standalone buildkitd over gRPC. Never the embedded
# builder: registry cache export needs this, structured progress is native to
# it, and it is the topology the infra team deploys.
buildkit_host = tcp://buildkitd:1234
# PINNED ON PURPOSE. `moby/buildkit:latest` is a build agent that changes
# underneath you without a commit. The whole value of the attempt corpus is that
# records are comparable across runs; if vertex semantics or error text shift
# mid-corpus the error signatures split and nobody can tell why. Bump
# deliberately, and expect a signature discontinuity when you do.
buildkit_version = v0.24.0
# Where buildkitd pushes. Reachable from the buildkitd container.
registry_push = registry:5000
insecure_registry = true
# Docker Hub (and similar) allow exactly namespace/repository, no deeper
# nesting -- unlike registry:2 / GHCR / ECR, which tolerate an arbitrary path.
# Set true for those and job identity folds into the tag instead of the path.
flat_registry = false
prune_on_cleanup = true

[kaniko]
# Only read when [builder] backend = kaniko.
namespace = default
# PINNED, same reasoning as buildkit_version above.
kaniko_image = gcr.io/kaniko-project/executor:v1.23.2
# Used only for the staging/digest-readback sidecar container.
helper_image = busybox:1.36
# Secret Kaniko reads its registry push credentials from (kubernetes.io/dockerconfigjson).
# K8sBuilder.ensure_registry_secret() creates/updates it; it does not invent one.
docker_config_secret = envbuild-registry-auth
# Empty -> kubectl's own default context. Set to point at a specific cluster
# without relying on ambient $KUBECONFIG.
kubeconfig =

[verifier]
# Where the HOST docker daemon pulls the same image from. Different host, same
# digest: dockerd trusts localhost registries without an --insecure-registry
# daemon flag, which is why this is not `registry:5000`.
registry_pull = localhost:5000
# Used only for tar in/out of the named volumes. Pin by digest before the corpus run.
helper_image = busybox:1.36
# e.g. 8g -- empty means no limit.
memory =

[budgets]
max_attempts = 5
wall_clock_s = 1200
build_timeout_s = 600
# Per verification container, and it governs L1, L2 and L3 alike. Was 180, which
# L1/L2 additionally hardcoded -- so raising this used to change L3 only, with
# nothing to say why the L1 timeout stayed. 300 because a cold container on a
# large image (mbmm's R stack is 857 MB) does not reliably clear 180s on a busy
# host, and because one rung should still not be able to eat a whole
# wall_clock_s budget.
verify_timeout_s = 300
max_image_bytes = 8589934592
max_context_bytes = 268435456

[paths]
# Left empty -> <skill dir>/outputs. attempts.jsonl and verdicts.jsonl land here.
