# envbuild configuration. Every value here is also settable per-run with
# `--config <file>`; the endpoint settings also read env vars, which is how the
# compose stack and the cluster differ without a code change.

[builder]
# The builder is Kaniko-in-Kubernetes, and only that. BuildKit needs privileged
# mode or a relaxed seccomp profile; the clusters this runs on deny both. See
# src/builder.py's module docstring.
namespace = default
# PINNED ON PURPOSE. `:latest` is a build agent that changes underneath you
# without a commit. The whole value of the attempt corpus is that records are
# comparable across runs; if error text shifts mid-corpus the signatures split
# and nobody can tell why. Bump deliberately, and expect a discontinuity.
kaniko_image = gcr.io/kaniko-project/executor:v1.23.2
# Used only for the staging/digest-readback sidecar container.
helper_image = busybox:1.36
# Secret Kaniko reads its registry push credentials from (kubernetes.io/dockerconfigjson).
# K8sBuilder.ensure_registry_secret() creates/updates it; it does not invent one.
docker_config_secret = envbuild-registry-auth
# Empty -> kubectl's own default context. Set to point at a specific cluster
# without relying on ambient $KUBECONFIG.
kubeconfig =
# Where the build pod pushes. It must be reachable FROM THE CLUSTER, which is
# why this is a real registry and not a compose-local one.
registry_push = docker.io/mismplatform
insecure_registry = false
# Docker Hub (and similar) allow exactly namespace/repository, no deeper
# nesting -- unlike registry:2 / GHCR / ECR, which tolerate an arbitrary path.
# true -> job identity folds into the tag instead of the path.
flat_registry = true

[verifier]
# Where the HOST docker daemon pulls the same image from. Empty means "pull the
# pushed ref as-is", which is right for a registry both sides can reach. Set it
# only when push and pull hostnames genuinely differ.
registry_pull =
# Used only for tar in/out of the named volumes. Pin by digest before the corpus run.
helper_image = busybox:1.36
# e.g. 8g -- empty means no limit.
memory =

[budgets]
max_attempts = 5
wall_clock_s = 1200
build_timeout_s = 600
# Per verification container, and it governs L1, L2 and L3 alike. Was 180, which
# L1/L2 additionally hardcoded -- so raising this used to change L3 only, with
# nothing to say why the L1 timeout stayed. 300 because a cold container on a
# large image (mbmm's R stack is 857 MB) does not reliably clear 180s on a busy
# host, and because one rung should still not be able to eat a whole
# wall_clock_s budget.
verify_timeout_s = 300
max_image_bytes = 8589934592
max_context_bytes = 268435456

[paths]
# Unset -> <skill dir>/outputs. attempts.jsonl and verdicts.jsonl land here.
